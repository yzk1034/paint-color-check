<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>工业调色实时参考 V6</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    min-height: 100%;
  }

  body {
    margin: 0;
    font: 14px/1.6 system-ui, -apple-system, "PingFang SC", sans-serif;
    background: #0b1220;
    color: #e8f1ff;
    padding-bottom: 190px;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 12px;
  }

  .stage {
    position: relative;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }

  video {
    display: none;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
  }

  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
  }

  .split {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 3px;
    background: #ff3b30;
    pointer-events: none;
    transform: translateX(-50%);
  }

  .zone {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 58px;
    height: 58px;
    border: 3px solid #22e0a6;
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(0,0,0,.35);
    pointer-events: none;
  }

  .zone span {
    position: absolute;
    left: 50%;
    top: 64px;
    transform: translateX(-50%);
    font-size: 12px;
    background: rgba(0,0,0,.6);
    padding: 3px 8px;
    border-radius: 8px;
    white-space: nowrap;
  }

  .zoneL { left: 25%; }
  .zoneR { left: 75%; }

  .panel {
    margin-top: 12px;
    background: linear-gradient(180deg, #1d6cff, #123f8f);
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
  }

  .title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .close {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #ff4d4f;
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 14px;
  }

  .deBox {
    background: rgba(255,255,255,.12);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 10px;
  }

  .big {
    font-size: 28px;
    font-weight: 800;
  }

  .tips {
    background: rgba(0,0,0,.22);
    border-radius: 12px;
    padding: 12px;
    min-height: 120px;
  }

  .tipLine {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,.12);
  }

  .tipLine:last-child {
    border-bottom: 0;
  }

  .tipName {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
  }

  .dot {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,.45);
    display: inline-block;
  }

  .muted {
    color: #c7d7ff;
    font-size: 12px;
  }

  .warn {
    color: #ffd166;
    font-size: 12px;
    margin-top: 10px;
  }

  .sw {
    display: flex;
    gap: 10px;
    margin: 12px 0;
  }

  .cell {
    flex: 1;
    background: #101a2c;
    border-radius: 12px;
    padding: 10px;
  }

  .chip {
    height: 54px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.2);
    background: #222;
  }

  .fixedBar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 99;
    background: rgba(11, 18, 32, .96);
    backdrop-filter: blur(8px);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    box-shadow: 0 -6px 18px rgba(0,0,0,.35);
  }

  .fixedBarInner {
    max-width: 560px;
    margin: 0 auto;
  }

  .row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .row:first-child {
    margin-top: 0;
  }

  button {
    flex: 1;
    padding: 11px 8px;
    border: 0;
    border-radius: 10px;
    background: #26364f;
    color: #e8f1ff;
    font-size: 14px;
  }

  button.green {
    background: #16a34a;
    color: #fff;
  }

  button.red {
    background: #ef4444;
    color: #fff;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas" width="640" height="480"></canvas>
    <div class="split"></div>
    <div class="zone zoneL"><span>样板区</span></div>
    <div class="zone zoneR"><span>调色区</span></div>
  </div>

  <div class="panel">
    <div class="title">
      <span>工业调色实时参考系统 V6</span>
      <span class="close">×</span>
    </div>

    <div class="deBox">
      <div>色差 ΔE00</div>
      <div class="big" id="de">--</div>
      <div id="deText">未启动实时对比</div>
    </div>

    <div class="tips" id="tips">
      <div class="muted">启动摄像头后，系统会持续读取左侧样板区和右侧调色区，并给出参考加色方向。</div>
    </div>

    <div class="warn">
      注意：百分比为手机摄像头趋势参考，受光线、白平衡、反光、曝光影响较大；实际请按小试梯度验证，不能直接当作精确加料量。
    </div>
  </div>

  <div class="sw">
    <div class="cell">
      <div class="chip" id="chipT"></div>
      <div id="hexT">#------</div>
      <div>样板色</div>
    </div>
    <div class="cell">
      <div class="chip" id="chipM"></div>
      <div id="hexM">#------</div>
      <div>调色区</div>
    </div>
  </div>
</div>

<div class="fixedBar">
  <div class="fixedBarInner">
    <div class="row">
      <button id="btnStart" class="green">启动摄像头</button>
      <button id="btnStop" class="red">停止</button>
    </div>

    <div class="row">
      <button id="btnTarget">左点=样板色</button>
      <button id="btnMix">右点=调色区</button>
    </div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

let stream = null;
let running = false;
let rafId = null;

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function hex(rgb) {
  return '#' + rgb.map(v => {
    return clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0');
  }).join('').toUpperCase();
}

function draw() {
  if (video.readyState >= 2) {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  }
}

function sample(x, y) {
  const px = clamp(Math.round(x * canvas.width), 0, canvas.width - 1);
  const py = clamp(Math.round(y * canvas.height), 0, canvas.height - 1);
  const d = ctx.getImageData(px, py, 1, 1).data;
  return [d[0], d[1], d[2]];
}

function setChip(id, rgb) {
  document.getElementById(id).style.background = hex(rgb);
}

function srgbToLinear(c) {
  c /= 255;
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}

function rgbToXyz(rgb) {
  const r = srgbToLinear(rgb[0]);
  const g = srgbToLinear(rgb[1]);
  const b = srgbToLinear(rgb[2]);

  return [
    r * 0.4124564 + g * 0.3575761 + b * 0.1804375,
    r * 0.2126729 + g * 0.7151522 + b * 0.0721750,
    r * 0.0193339 + g * 0.1191920 + b * 0.9503041
  ];
}

function xyzToLab(xyz) {
  const wp = [0.95047, 1, 1.08883];

  const f = t => {
    return t > 0.008856 ? Math.cbrt(t) : (7.787 * t + 16 / 116);
  };

  const fx = f(xyz[0] / wp[0]);
  const fy = f(xyz[1] / wp[1]);
  const fz = f(xyz[2] / wp[2]);

  return [
    116 * fy - 16,
    500 * (fx - fy),
    200 * (fy - fz)
  ];
}

function rgbToLab(rgb) {
  return xyzToLab(rgbToXyz(rgb));
}

function deltaE00(l1, l2) {
  const rad = d => d * Math.PI / 180;
  const deg = r => r * 180 / Math.PI;

  const [L1, a1, b1] = l1;
  const [L2, a2, b2] = l2;

  const C1 = Math.hypot(a1, b1);
  const C2 = Math.hypot(a2, b2);
  const C = (C1 + C2) / 2;

  const G = 0.5 * (1 - Math.sqrt(Math.pow(C, 7) / (Math.pow(C, 7) + Math.pow(25, 7))));
  const a1p = (1 + G) * a1;
  const a2p = (1 + G) * a2;

  const C1p = Math.hypot(a1p, b1);
  const C2p = Math.hypot(a2p, b2);

  const h1p = (deg(Math.atan2(b1, a1p)) + 360) % 360;
  const h2p = (deg(Math.atan2(b2, a2p)) + 360) % 360;

  let dhp = 0;
  if (C1p * C2p !== 0) {
    dhp = h2p - h1p;
    if (dhp > 180) dhp -= 360;
    if (dhp < -180) dhp += 360;
  }

  const dLp = L2 - L1;
  const dCp = C2p - C1p;
  const dHp = 2 * Math.sqrt(C1p * C2p) * Math.sin(rad(dhp) / 2);

  const Lbp = (L1 + L2) / 2;
  const Cbp = (C1p + C2p) / 2;

  let hbp = h1p + h2p;
  if (C1p * C2p !== 0) {
    if (Math.abs(h1p - h2p) > 180) hbp += 360;
    hbp /= 2;
    if (hbp < 0) hbp += 360;
  }

  const T = 1
    - 0.17 * Math.cos(rad(hbp - 30))
    + 0.24 * Math.cos(rad(2 * hbp))
    + 0.32 * Math.cos(rad(3 * hbp + 6))
    - 0.20 * Math.cos(rad(4 * hbp - 63));

  const dTheta = 30 * Math.exp(-Math.pow((hbp - 275) / 25, 2));
  const Rc = 2 * Math.sqrt(Math.pow(Cbp, 7) / (Math.pow(Cbp, 7) + Math.pow(25, 7)));
  const Sl = 1 + (0.015 * Math.pow(Lbp - 50, 2)) / Math.sqrt(20 + Math.pow(Lbp - 50, 2));
  const Sc = 1 + 0.045 * Cbp;
  const Sh = 1 + 0.015 * Cbp * T;
  const Rt = -Math.sin(rad(2 * dTheta)) * Rc;

  return Math.sqrt(
    Math.pow(dLp / Sl, 2) +
    Math.pow(dCp / Sc, 2) +
    Math.pow(dHp / Sh, 2) +
    Rt * (dCp / Sc) * (dHp / Sh)
  );
}

function level(de) {
  if (de < 1) return '几乎一致';
  if (de < 2) return '极接近';
  if (de < 3.5) return '很接近';
  if (de < 6) return '较接近';
  if (de < 10) return '有可见差异';
  return '差异明显，需继续小试';
}

function pct(v, max) {
  return Math.min(max, Math.abs(v)).toFixed(3) + '%';
}

function buildPigmentAdvice(target, mix) {
  const lt = rgbToLab(target);
  const lm = rgbToLab(mix);

  const dL = lt[0] - lm[0];
  const da = lt[1] - lm[1];
  const db = lt[2] - lm[2];

  const items = [];

  if (dL > 1.2) {
    items.push({
      name: '加钛白',
      color: '#f5f5f5',
      value: pct(dL * 0.025, 0.800)
    });
  }

  if (dL < -1.2) {
    items.push({
      name: '加黑',
      color: '#111111',
      value: pct(Math.abs(dL) * 0.018, 0.500)
    });
  }

  if (da > 1.2) {
    items.push({
      name: '加大红',
      color: '#e23b3b',
      value: pct(da * 0.022, 0.500)
    });
  }

  if (da < -1.2) {
    items.push({
      name: '加绿',
      color: '#20a86a',
      value: pct(Math.abs(da) * 0.022, 0.500)
    });
  }

  if (db > 1.2) {
    items.push({
      name: '加中黄',
      color: '#f0c33d',
      value: pct(db * 0.022, 0.500)
    });
  }

  if (db < -1.2) {
    items.push({
      name: '加蓝',
      color: '#3f68e0',
      value: pct(Math.abs(db) * 0.022, 0.500)
    });
  }

  if (items.length === 0) {
    items.push({
      name: '方向接近',
      color: '#22e0a6',
      value: '建议小试复测'
    });
  }

  return items;
}

function renderAdvice(items) {
  document.getElementById('tips').innerHTML = items.map(x => {
    return `
      <div class="tipLine">
        <div class="tipName">
          <span class="dot" style="background:${x.color}"></span>
          <span>${x.name}</span>
        </div>
        <span>${x.value}</span>
      </div>
    `;
  }).join('');
}

function updateRealtime() {
  if (!running) return;

  draw();

  const target = sample(0.25, 0.5);
  const mix = sample(0.75, 0.5);

  setChip('chipT', target);
  setChip('chipM', mix);

  document.getElementById('hexT').textContent = hex(target);
  document.getElementById('hexM').textContent = hex(mix);

  const de = deltaE00(rgbToLab(target), rgbToLab(mix));

  document.getElementById('de').textContent = de.toFixed(2);
  document.getElementById('deText').textContent = level(de);

  renderAdvice(buildPigmentAdvice(target, mix));

  rafId = requestAnimationFrame(updateRealtime);
}

document.getElementById('btnStart').onclick = async () => {
  try {
